<svg width="800" height="160" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900');
  </style>

  <defs>
    <pattern id="halftone" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#000" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- ═══ BACKGROUND ═══ -->
  <rect width="800" height="160" fill="#FFFDF5"/>
  <rect width="800" height="160" fill="url(#halftone)"/>

  <!-- ═══ OUTER BORDER ═══ -->
  <rect x="2" y="2" width="796" height="156" fill="none" stroke="#000" stroke-width="4"/>

  <!-- ═══ THICK TIMELINE LINE ═══ -->
  <line x1="80" y1="72" x2="620" y2="72" stroke="#000" stroke-width="4"/>

  <!-- ═══ NODE 1: 2024 (completed — violet) ═══ -->
  <!-- Shadow -->
  <rect x="100" y="49" width="66" height="50" fill="#000"/>
  <!-- Card -->
  <rect x="96" y="45" width="66" height="50" fill="#C4B5FD" stroke="#000" stroke-width="3"/>
  <text x="129" y="65" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial Black', sans-serif"
        font-size="15" font-weight="900" fill="#000">2024</text>
  <text x="129" y="80" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="7" font-weight="700" fill="#000"
        letter-spacing="1.5">FOUNDATIONS</text>
  <text x="152" y="58" text-anchor="middle"
        font-family="'Space Grotesk', sans-serif"
        font-size="10" font-weight="700" fill="#000">✓</text>
  <!-- Label below -->
  <text x="129" y="115" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="10" font-weight="700" fill="#000">SRM KTR</text>

  <!-- ═══ NODE 2: 2025 (completed — yellow) ═══ -->
  <!-- Shadow -->
  <rect x="308" y="49" width="66" height="50" fill="#000"/>
  <!-- Card -->
  <rect x="304" y="45" width="66" height="50" fill="#FFD93D" stroke="#000" stroke-width="3"/>
  <text x="337" y="65" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial Black', sans-serif"
        font-size="15" font-weight="900" fill="#000">2025</text>
  <text x="337" y="80" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="7" font-weight="700" fill="#000"
        letter-spacing="1.5">FULL STACK</text>
  <text x="360" y="58" text-anchor="middle"
        font-family="'Space Grotesk', sans-serif"
        font-size="10" font-weight="700" fill="#000">✓</text>
  <!-- Label below -->
  <text x="337" y="115" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="10" font-weight="700" fill="#000">+ AI/ML</text>

  <!-- ═══ NODE 3: NOW / 2026 (active — red, larger, pulsing) ═══ -->
  <!-- Pulsing glow behind card -->
  <rect x="505" y="34" width="82" height="68" fill="#FF6B6B" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.05;0.15" dur="2s" repeatCount="indefinite"/>
  </rect>
  <!-- Shadow (bigger) -->
  <rect x="516" y="42" width="78" height="62" fill="#000"/>
  <!-- Card -->
  <rect x="510" y="36" width="78" height="62" fill="#FF6B6B" stroke="#000" stroke-width="4"/>
  <text x="549" y="55" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial Black', sans-serif"
        font-size="9" font-weight="900" fill="#000"
        letter-spacing="2">NOW ►</text>
  <text x="549" y="72" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial Black', sans-serif"
        font-size="16" font-weight="900" fill="#000">2026</text>
  <text x="549" y="88" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="7" font-weight="700" fill="#000"
        letter-spacing="1">AI RESEARCH</text>
  <!-- Label below -->
  <text x="549" y="118" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="10" font-weight="700" fill="#000">+ OPEN SOURCE</text>

  <!-- ═══ DECORATIVE: Spinning star ═══ -->
  <g transform="translate(640, 52)">
    <text text-anchor="middle" dominant-baseline="central"
          font-size="18" fill="#FFD93D" stroke="#000" stroke-width="0.8">
      ★
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ═══ "TIMELINE" BADGE (rotated yellow sticker, bottom-right) ═══ -->
  <g transform="translate(720, 132) rotate(3)">
    <rect x="-48" y="-11" width="96" height="22" fill="#000" transform="translate(3, 3)"/>
    <rect x="-48" y="-11" width="96" height="22" fill="#FFD93D" stroke="#000" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle"
          font-family="'Space Grotesk', 'Arial Black', sans-serif"
          font-size="9" font-weight="900" fill="#000"
          letter-spacing="2">★ TIMELINE</text>
  </g>
</svg>
