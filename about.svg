<svg width="800" height="330" viewBox="0 0 800 330" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900');
  </style>

  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#000" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- ═══ BACKGROUND ═══ -->
  <rect width="800" height="330" fill="#FFFDF5"/>
  <rect width="800" height="330" fill="url(#dots)"/>

  <!-- ═══ OUTER BORDER ═══ -->
  <rect x="2" y="2" width="796" height="326" fill="none" stroke="#000" stroke-width="4"/>

  <!-- ═══ "ABOUT ME" BADGE (rotated red sticker) ═══ -->
  <g transform="translate(80, 32) rotate(2)">
    <rect x="-58" y="-15" width="116" height="30" fill="#000" transform="translate(4, 4)"/>
    <rect x="-58" y="-15" width="116" height="30" fill="#FF6B6B" stroke="#000" stroke-width="3"/>
    <text x="0" y="5" text-anchor="middle"
          font-family="'Space Grotesk', 'Arial Black', sans-serif"
          font-size="13" font-weight="900" fill="#000"
          letter-spacing="2">★ ABOUT ME</text>
  </g>

  <!-- ═══ UNIVERSITY INFO (top-right) ═══ -->
  <text x="770" y="37" text-anchor="end"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="11" font-weight="700" fill="#000"
        letter-spacing="1">SRM KTR · BTECH CSE · YEAR 2</text>

  <!-- ═══ LEFT CARD: BUILDING ═══ -->
  <!-- Shadow -->
  <rect x="30" y="71" width="364" height="145" fill="#000"/>
  <!-- Card body -->
  <rect x="24" y="65" width="364" height="145" fill="#FFF" stroke="#000" stroke-width="4"/>
  <!-- Header bar (violet) -->
  <rect x="26" y="67" width="360" height="30" fill="#C4B5FD"/>
  <line x1="24" y1="97" x2="388" y2="97" stroke="#000" stroke-width="4"/>
  <text x="42" y="88"
        font-family="'Space Grotesk', 'Arial Black', sans-serif"
        font-size="13" font-weight="900" fill="#000"
        letter-spacing="2">► BUILDING</text>
  <!-- Body text -->
  <text x="42" y="122"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="14" font-weight="700" fill="#000">• AI/ML systems</text>
  <text x="42" y="146"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="14" font-weight="700" fill="#000">• Scalable fullstack apps</text>
  <text x="42" y="170"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="14" font-weight="700" fill="#000">• High-performance C++</text>
  <!-- Small decorative star -->
  <text x="360" y="190"
        font-family="'Space Grotesk', sans-serif"
        font-size="16" fill="#C4B5FD" text-anchor="end">★</text>

  <!-- ═══ RIGHT CARD: LEARNING ═══ -->
  <!-- Shadow -->
  <rect x="418" y="71" width="364" height="145" fill="#000"/>
  <!-- Card body -->
  <rect x="412" y="65" width="364" height="145" fill="#FFF" stroke="#000" stroke-width="4"/>
  <!-- Header bar (yellow) -->
  <rect x="414" y="67" width="360" height="30" fill="#FFD93D"/>
  <line x1="412" y1="97" x2="776" y2="97" stroke="#000" stroke-width="4"/>
  <text x="430" y="88"
        font-family="'Space Grotesk', 'Arial Black', sans-serif"
        font-size="13" font-weight="900" fill="#000"
        letter-spacing="2">► LEARNING</text>
  <!-- Body text -->
  <text x="430" y="122"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="14" font-weight="700" fill="#000">• Machine Learning</text>
  <text x="430" y="146"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="14" font-weight="700" fill="#000">• Advanced C++</text>
  <text x="430" y="170"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="14" font-weight="700" fill="#000">• Systems Engineering</text>
  <!-- Small decorative star -->
  <text x="748" y="190"
        font-family="'Space Grotesk', sans-serif"
        font-size="16" fill="#FFD93D" text-anchor="end">★</text>

  <!-- ═══ BOTTOM QUOTE CARD (red, full-width, rotated -1°) ═══ -->
  <g transform="translate(400, 250) rotate(-1)">
    <!-- Shadow -->
    <rect x="-376" y="-22" width="752" height="48" fill="#000" transform="translate(6, 6)"/>
    <!-- Card -->
    <rect x="-376" y="-22" width="752" height="48" fill="#FF6B6B" stroke="#000" stroke-width="4"/>
    <!-- Quote text -->
    <text x="0" y="6" text-anchor="middle"
          font-family="'Space Grotesk', 'Arial', sans-serif"
          font-size="15" font-weight="700" fill="#000"
          letter-spacing="1">"Optimize skills like I optimize code — relentlessly."</text>
  </g>

  <!-- ═══ STATUS LINE ═══ -->
  <circle cx="38" cy="308" r="5" fill="#28c840" stroke="#000" stroke-width="2"/>
  <text x="52" y="313"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="12" font-weight="700" fill="#000"
        letter-spacing="1">ONLINE — Always building, always shipping</text>
</svg>
