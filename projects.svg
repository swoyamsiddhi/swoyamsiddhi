  <text x="40" y="341"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="13" font-weight="700" fill="#000">Showcasing the full coding journey.</text>
  <!-- Tech pills -->
  <rect x="40" y="358" width="68" height="18" fill="#FFFDF5" stroke="#000" stroke-width="2"/>
  <text x="74" y="371" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="8" font-weight="700" fill="#000">TypeScript</text>
  <rect x="114" y="358" width="48" height="18" fill="#FFFDF5" stroke="#000" stroke-width="2"/>
  <text x="138" y="371" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="8" font-weight="700" fill="#000">React</text>
  <rect x="168" y="358" width="60" height="18" fill="#FFFDF5" stroke="#000" stroke-width="2"/>
  <text x="198" y="371" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="8" font-weight="700" fill="#000">Tailwind</text>
  <rect x="234" y="358" width="48" height="18" fill="#FFFDF5" stroke="#000" stroke-width="2"/>
  <text x="258" y="371" text-anchor="middle"
