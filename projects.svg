  <!-- ═══ BOTTOM BAR ═══ -->
  <text x="40" y="438"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="10" font-weight="700" fill="#000" opacity="0.4"
        letter-spacing="1">★ MEDIVAULT · HEARTATTACK PREDICTOR · SWOYAMCODES · ALWAYS BUILDING ★</text>
