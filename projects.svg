  <!-- Tech pills -->
  <rect x="428" y="158" width="52" height="18" fill="#FFFDF5" stroke="#000" stroke-width="2"/>
  <text x="454" y="171" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="8" font-weight="700" fill="#000">Python</text>
  <rect x="486" y="158" width="68" height="18" fill="#FFFDF5" stroke="#000" stroke-width="2"/>
  <text x="520" y="171" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="8" font-weight="700" fill="#000">scikit-learn</text>
  <rect x="560" y="158" width="52" height="18" fill="#FFFDF5" stroke="#000" stroke-width="2"/>
  <text x="586" y="171" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="8" font-weight="700" fill="#000">Pandas</text>
