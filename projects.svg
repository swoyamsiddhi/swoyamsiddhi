  <!-- Description -->
  <text x="428" y="108"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="12" font-weight="700" fill="#000">Machine learning model to predict</text>
  <text x="428" y="125"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="12" font-weight="700" fill="#000">heart attack risk using patient</text>
  <text x="428" y="142"
        font-family="'Space Grotesk', 'Arial', sans-serif"
