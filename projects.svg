<svg width="800" height="460" viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900');
  </style>

  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#000" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- ═══ BACKGROUND ═══ -->
  <rect width="800" height="460" fill="#FFFDF5"/>
  <rect width="800" height="460" fill="url(#grid)"/>

  <!-- ═══ OUTER BORDER ═══ -->
  <rect x="2" y="2" width="796" height="456" fill="none" stroke="#000" stroke-width="4"/>

  <!-- ═══ "PROJECTS" BADGE (rotated yellow sticker) ═══ -->
  <g transform="translate(82, 28) rotate(-2)">
    <rect x="-60" y="-14" width="120" height="28" fill="#000" transform="translate(4, 4)"/>
    <rect x="-60" y="-14" width="120" height="28" fill="#FFD93D" stroke="#000" stroke-width="3"/>
    <text x="0" y="4" text-anchor="middle"
          font-family="'Space Grotesk', 'Arial Black', sans-serif"
          font-size="12" font-weight="900" fill="#000"
          letter-spacing="2">★ PROJECTS</text>
  </g>

  <!-- ════════════════════════════════════════ -->
  <!--  PROJECT 1: MEDIVAULT (top-left, red)   -->
  <!-- ════════════════════════════════════════ -->

  <!-- Shadow -->
  <rect x="30" y="61" width="364" height="170" fill="#000"/>
  <!-- Card -->
  <rect x="24" y="55" width="364" height="170" fill="#FFF" stroke="#000" stroke-width="4"/>
  <!-- Header (red) -->
  <rect x="26" y="57" width="360" height="30" fill="#FF6B6B"/>
  <line x1="24" y1="87" x2="388" y2="87" stroke="#000" stroke-width="4"/>
  <!-- Title -->
  <text x="40" y="78"
        font-family="'Space Grotesk', 'Arial Black', sans-serif"
        font-size="15" font-weight="900" fill="#000"
        letter-spacing="2">MEDIVAULT</text>
  <!-- Tag pill -->
  <rect x="320" y="63" width="48" height="18" rx="9" fill="#000"/>
  <text x="344" y="75" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="8" font-weight="700" fill="#FF6B6B"
        letter-spacing="1">AI/ML</text>
  <!-- Description -->
  <text x="40" y="108"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="12" font-weight="700" fill="#000">AI-powered medical report analyzer.</text>
  <text x="40" y="125"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="12" font-weight="700" fill="#000">Reads CBC reports, flags anomalies,</text>
  <text x="40" y="142"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="12" font-weight="700" fill="#000">generates urgency scores &amp; summaries.</text>
  <!-- Tech pills -->
  <rect x="40" y="158" width="68" height="18" fill="#FFFDF5" stroke="#000" stroke-width="2"/>
  <text x="74" y="171" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="8" font-weight="700" fill="#000">TypeScript</text>
  <rect x="114" y="158" width="52" height="18" fill="#FFFDF5" stroke="#000" stroke-width="2"/>
  <text x="140" y="171" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="8" font-weight="700" fill="#000">Next.js</text>
  <rect x="172" y="158" width="42" height="18" fill="#FFFDF5" stroke="#000" stroke-width="2"/>
  <text x="193" y="171" text-anchor="middle"
        font-family="'Space Grotesk', 'Arial', sans-serif"
        font-size="8" font-weight="700" fill="#000">AI/ML</text>
  <!-- View link -->
  <text x="360" y="205" text-anchor="end"
        font-family="'Space Grotesk', 'Arial Black', sans-serif"
        font-size="11" font-weight="900" fill="#FF6B6B"
        letter-spacing="1">→ VIEW</text>

